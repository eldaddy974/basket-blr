name: Rapport des inscriptions aux admins

on:
  schedule:
    # 10 h 05 à La Réunion (UTC+4), le vendredi; décalé de 5 minutes pour éviter le pic de charge à l’heure pile.
    - cron: '5 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run report
        env:
          SUPABASE_URL: https://sgkomdvgocrmsrmcktnn.supabase.co
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
