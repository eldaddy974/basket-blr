name: Rapport des inscriptions aux admins

on:
  schedule:
    # 12 h 05 à La Réunion (UTC+4), du dimanche au jeudi; décalé de 5 minutes pour éviter le pic de charge à l’heure pile.
    - cron: '5 8 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rapport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Installer Chromium avec relances réseau
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Échec réseau temporaire pendant l’installation de Chromium; nouvelle tentative dans 15 secondes."
              sleep 15
            fi
          done
          exit 1
      - run: npm run report
        env:
          SUPABASE_URL: https://sgkomdvgocrmsrmcktnn.supabase.co
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
