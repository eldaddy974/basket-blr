<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asso BLR — Basket Loisir Réunion</title>
  <link rel="icon" href="https://i.ibb.co/6RpLFRtf/Photo-Grid-Site-1747833719453.png">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 font-sans antialiased pb-10">

  <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="https://i.ibb.co/6RpLFRtf/Photo-Grid-Site-1747833719453.png"
           alt="Logo BLR" class="w-11 h-11 rounded-full border border-slate-200">
      <div>
        <h1 class="text-base font-extrabold text-slate-900">Asso BLR</h1>
        <p class="text-xs font-bold text-blue-600">Basket Loisir Réunion</p>
        <p class="text-[11px] text-slate-500">Joueur : <b id="joueur-entete"></b></p>
      </div>
    </div>
    <button onclick="ouvrirProfil()"
      class="bg-slate-100 text-slate-700 font-semibold text-xs px-3 py-2 rounded-lg border border-slate-300">
      Profil
    </button>
  </header>

  <div id="message-erreur" class="hidden m-4 rounded-xl border border-red-300 bg-red-50 p-4 text-sm font-semibold text-red-800"></div>

  <main id="sessions-container" class="max-w-md mx-auto p-4 space-y-4"></main>

  <!-- PROFIL -->
  <div id="modal-profil" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <h2 class="font-extrabold text-slate-900 text-lg">Mon profil</h2>

      <label class="block text-xs font-bold text-slate-700">
        Prénom
        <input id="profil-prenom" type="text" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
      </label>

      <label class="block text-xs font-bold text-slate-700">
        Nom
        <input id="profil-nom" type="text" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
      </label>

      <label class="flex items-center justify-between gap-3 p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
        <span>
          <span class="block text-sm font-bold text-emerald-900">Abonné Saison</span>
          <span class="block text-xs text-emerald-700">Vote direct en place confirmée</span>
        </span>
        <input id="profil-abonne" type="checkbox" class="w-5 h-5 accent-emerald-600">
      </label>

      <div class="border-t border-slate-100 pt-3">
        <label class="flex items-center justify-between gap-3">
          <span class="text-sm font-bold text-slate-700">Mode Administrateur</span>
          <input id="profil-admin" type="checkbox" onchange="afficherZoneMotDePasse()" class="w-5 h-5 accent-blue-600">
        </label>

        <div id="zone-mot-de-passe" class="hidden mt-3">
          <label for="profil-mot-de-passe" class="block text-xs font-bold text-slate-700">
            Mot de passe Administrateur
          </label>
          <div class="flex mt-1">
            <input id="profil-mot-de-passe" type="password" autocomplete="current-password"
              placeholder="Entrez le mot de passe"
              class="min-w-0 flex-1 border border-amber-300 bg-amber-50 rounded-l-lg p-2.5 text-sm">
            <button type="button" onclick="basculerVisibiliteMotDePasse()"
              class="border border-l-0 border-amber-300 bg-amber-100 px-3 rounded-r-lg text-xs font-bold text-amber-900">
              Afficher
            </button>
          </div>
        </div>
      </div>

      <p id="profil-message" class="hidden text-xs font-semibold rounded-lg p-2"></p>

      <div class="flex gap-2 pt-1">
        <button onclick="fermerProfil()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-lg text-sm">
          Fermer
        </button>
        <button id="bouton-enregistrer-profil" onclick="sauvegarderProfil()"
          class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm">
          Enregistrer
        </button>
      </div>
    </div>
  </div>

  <!-- INVITÉ -->
  <div id="modal-invite" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
      <h2 class="font-extrabold text-slate-900 text-lg">Inscrire un invité</h2>
      <label class="block text-xs font-bold text-slate-700">
        Prénom de l’invité
        <input id="invite-prenom" type="text" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
      </label>
      <label class="block text-xs font-bold text-slate-700">
        Nom de l’invité
        <input id="invite-nom" type="text" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
      </label>
      <div class="flex gap-2">
        <button onclick="fermerInvite()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-lg text-sm">Annuler</button>
        <button onclick="inscrireInvite()" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm">Inscrire</button>
      </div>
    </div>
  </div>

  <!-- MODIFIER UNE SESSION -->
  <div id="modal-edition" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
      <h2 class="font-extrabold text-slate-900 text-lg">Modifier la session</h2>
      <p id="edition-nom-session" class="text-sm text-slate-600"></p>

      <label class="block text-xs font-bold text-slate-700">
        Jour et date
        <input id="edition-date" type="date" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="block text-xs font-bold text-slate-700">
          Heure de début
          <input id="edition-debut" type="time" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
        </label>
        <label class="block text-xs font-bold text-slate-700">
          Heure de fin
          <input id="edition-fin" type="time" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 text-sm">
        </label>
      </div>

      <div class="flex gap-2">
        <button onclick="fermerEdition()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-lg text-sm">Fermer</button>
        <button onclick="enregistrerModificationSession()" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- PARTICIPANTS -->
  <div id="modal-participants" class="hidden fixed inset-0 z-50 bg-black/50 flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col w-full max-w-md mx-auto overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50">
        <div>
          <h2 id="participants-titre" class="font-extrabold text-slate-900">Participants</h2>
          <p class="text-xs text-slate-500">Confirmés et file d’attente</p>
        </div>
        <button onclick="fermerParticipants()" class="text-blue-600 font-bold">Fermer</button>
      </div>
      <div id="participants-corps" class="overflow-y-auto p-4 space-y-3"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://sgkomdvgocrmsrmcktnn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_5MB-vD9ZvTa_gfHsitfOng__XVP5PL5';
  const ADMIN_FUNCTION_NAME = 'admin-actions';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let profil = {
    prenom: localStorage.getItem('blr_prenom') || 'Dave',
    nom: localStorage.getItem('blr_nom') || 'Govinden',
    abonne: localStorage.getItem('blr_abonne') === 'true',
    admin: false
  };

  let motDePasseAdminEnMemoire = '';
  let sessions = [];
  let inscriptions = [];
  let sessionInviteId = null;
  let sessionEditionId = null;

  function echapper(valeur) {
    return String(valeur ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function memeNom(p1, n1, p2, n2) {
    return String(p1 || '').trim().toLowerCase() === String(p2 || '').trim().toLowerCase()
      && String(n1 || '').trim().toLowerCase() === String(n2 || '').trim().toLowerCase();
  }

  function afficherErreur(message) {
    const el = document.getElementById('message-erreur');
    el.textContent = message;
    el.classList.remove('hidden');
  }

  function cacherErreur() {
    document.getElementById('message-erreur').classList.add('hidden');
  }

  function formatHorodatage(valeur) {
    if (!valeur) return '';
    const date = new Date(Number(valeur));
    if (isNaN(date.getTime())) return '';
    return date.toLocaleString('fr-FR', {
      weekday: 'long',
      day: '2-digit',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }).replace(':', 'h');
  }

  function prochaineDate(jourSemaine, heure, minute) {
    const maintenant = new Date();
    const date = new Date(maintenant);
    let difference = (jourSemaine - date.getDay() + 7) % 7;
    date.setDate(date.getDate() + difference);
    date.setHours(heure, minute, 0, 0);
    if (date <= maintenant) date.setDate(date.getDate() + 7);
    return date;
  }

  function sessionsLocales() {
    return [
      {
        id: 'session-mardi',
        nom: 'Mardi — Session 1',
        horaires: '19h00 - 21h30',
        debut_date: prochaineDate(2, 19, 0).toISOString(),
        max_capacity: 22,
        statut: 'ouvert'
      },
      {
        id: 'session-jeudi',
        nom: 'Jeudi — Session 2',
        horaires: '19h30 - 21h30',
        debut_date: prochaineDate(4, 19, 30).toISOString(),
        max_capacity: 22,
        statut: 'ouvert'
      }
    ];
  }

  async function demarrer() {
    mettreAJourProfil();
    sessions = sessionsLocales();
    afficherSessions();

    try {
      const { data, error } = await supabaseClient
        .from('sessions').select('*').order('debut_date', { ascending: true });
      if (error) throw error;
      if (data && data.length) sessions = data;

      await rechargerInscriptions();

      supabaseClient
        .channel('blr-inscriptions')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inscriptions' }, rechargerInscriptions)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, rechargerTout)
        .subscribe();
    } catch (error) {
      afficherErreur('Erreur Supabase : ' + (error.message || error));
    }
  }

  async function rechargerTout() {
    try {
      const { data, error } = await supabaseClient
        .from('sessions').select('*').order('debut_date', { ascending: true });
      if (error) throw error;
      if (data && data.length) sessions = data;
      await rechargerInscriptions();
    } catch (error) {
      afficherErreur('Impossible de lire les sessions : ' + (error.message || error));
    }
  }

  async function rechargerInscriptions() {
    try {
      const { data, error } = await supabaseClient.from('inscriptions').select('*');
      if (error) throw error;
      inscriptions = data || [];
      cacherErreur();
      afficherSessions();
    } catch (error) {
      afficherErreur('Impossible de lire les inscriptions : ' + (error.message || error));
    }
  }

  function mettreAJourProfil() {
    document.getElementById('joueur-entete').textContent = `${profil.prenom} ${profil.nom}`;
    document.getElementById('profil-prenom').value = profil.prenom;
    document.getElementById('profil-nom').value = profil.nom;
    document.getElementById('profil-abonne').checked = profil.abonne;
    document.getElementById('profil-admin').checked = profil.admin;
    afficherZoneMotDePasse();
  }

  function ouvrirProfil() {
    mettreAJourProfil();
    document.getElementById('profil-mot-de-passe').value = '';
    document.getElementById('profil-mot-de-passe').type = 'password';
    document.getElementById('profil-message').classList.add('hidden');
    document.getElementById('modal-profil').classList.remove('hidden');
  }

  function fermerProfil() {
    document.getElementById('modal-profil').classList.add('hidden');
  }

  function afficherZoneMotDePasse() {
    const afficher = document.getElementById('profil-admin').checked && !profil.admin;
    document.getElementById('zone-mot-de-passe').classList.toggle('hidden', !afficher);
  }

  function basculerVisibiliteMotDePasse() {
    const input = document.getElementById('profil-mot-de-passe');
    const bouton = input.parentElement.querySelector('button');
    const visible = input.type === 'password';
    input.type = visible ? 'text' : 'password';
    bouton.textContent = visible ? 'Masquer' : 'Afficher';
  }

  function afficherMessageProfil(texte, erreur = false) {
    const el = document.getElementById('profil-message');
    el.textContent = texte;
    el.className = erreur
      ? 'text-xs font-semibold rounded-lg p-2 bg-red-50 text-red-800'
      : 'text-xs font-semibold rounded-lg p-2 bg-emerald-50 text-emerald-800';
  }

  async function appelerFonctionAdmin(action, donnees = {}) {
    const { data, error } = await supabaseClient.functions.invoke(ADMIN_FUNCTION_NAME, {
      body: {
        action,
        password: motDePasseAdminEnMemoire,
        ...donnees
      }
    });

    if (error) throw error;
    if (data?.error) throw new Error(data.error);
    if (data?.authorized === false) throw new Error('Mot de passe administrateur incorrect.');
    return data;
  }

  async function sauvegarderProfil() {
    const prenom = document.getElementById('profil-prenom').value.trim();
    const nom = document.getElementById('profil-nom').value.trim();
    const abonne = document.getElementById('profil-abonne').checked;
    const adminCoche = document.getElementById('profil-admin').checked;

    if (!prenom || !nom) {
      afficherMessageProfil('Prénom et nom obligatoires.', true);
      return;
    }

    profil.prenom = prenom;
    profil.nom = nom;
    profil.abonne = abonne;
    localStorage.setItem('blr_prenom', prenom);
    localStorage.setItem('blr_nom', nom);
    localStorage.setItem('blr_abonne', String(abonne));

    if (!adminCoche) {
      profil.admin = false;
      motDePasseAdminEnMemoire = '';
      mettreAJourProfil();
      afficherSessions();
      afficherMessageProfil('Profil enregistré.');
      return;
    }

    if (profil.admin && motDePasseAdminEnMemoire) {
      mettreAJourProfil();
      afficherSessions();
      afficherMessageProfil('Profil enregistré. Mode Administrateur actif.');
      return;
    }

    const motDePasse = document.getElementById('profil-mot-de-passe').value;
    if (!motDePasse) {
      profil.admin = false;
      mettreAJourProfil();
      afficherSessions();
      document.getElementById('profil-admin').checked = true;
      afficherZoneMotDePasse();
      afficherMessageProfil('Profil enregistré. Saisis le mot de passe pour activer le mode Administrateur.', true);
      return;
    }

    const bouton = document.getElementById('bouton-enregistrer-profil');
    bouton.disabled = true;
    bouton.textContent = 'Vérification…';
    motDePasseAdminEnMemoire = motDePasse;

    try {
      const resultat = await appelerFonctionAdmin('verify_admin');
      if (resultat?.authorized !== true) {
        throw new Error('La fonction admin-actions n’a pas confirmé le mot de passe.');
      }
      profil.admin = true;
      mettreAJourProfil();
      afficherSessions();
      afficherMessageProfil('Profil enregistré. Mode Administrateur activé.');
    } catch (error) {
      motDePasseAdminEnMemoire = '';
      profil.admin = false;
      mettreAJourProfil();
      afficherSessions();
      document.getElementById('profil-admin').checked = false;
      afficherZoneMotDePasse();
      afficherMessageProfil(
        'Profil enregistré, mais le mode Administrateur n’a pas été activé : ' + (error.message || error),
        true
      );
    } finally {
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer';
    }
  }

  function inscritsPour(sessionId) {
    return inscriptions.filter(i => i && i.session_id === sessionId);
  }

  function afficherSessions() {
    const container = document.getElementById('sessions-container');
    container.innerHTML = '';

    sessions.forEach(session => {
      const inscrits = inscritsPour(session.id);
      const confirmes = inscrits.filter(i => i.statut === 'confirmed');
      const attente = inscrits
        .filter(i => i.statut === 'waitlisted')
        .sort((a, b) => Number(a.date_demande || 0) - Number(b.date_demande || 0));

      const monVote = inscrits.find(i =>
        !i.est_invite && memeNom(i.prenom, i.nom, profil.prenom, profil.nom)
      );

      const nomParrain = `${profil.prenom} ${profil.nom}`.trim().toLowerCase();
      const mesInvites = inscrits.filter(i =>
        i.est_invite && String(i.invite_par_nom || '').trim().toLowerCase() === nomParrain
      );

      const capacite = Number(session.max_capacity) || 22;
      const plein = confirmes.length >= capacite;
      const avantH24 = (new Date(session.debut_date).getTime() - Date.now()) / 3600000 > 24;
      const annulee = session.statut === 'annulee';

      const boutonVote = !annulee
        ? (monVote
          ? `<button onclick="annulerInscription('${echapper(monVote.id)}')"
               class="flex-1 bg-red-600 text-white font-extrabold text-xs py-3 rounded-xl">
               Annuler ma place (${monVote.statut === 'confirmed' ? 'Confirmée' : 'Attente'})
             </button>`
          : `<button onclick="participer('${echapper(session.id)}')"
               class="flex-1 ${plein ? 'bg-orange-600' : 'bg-blue-600'} text-white font-extrabold text-xs py-3 rounded-xl">
               ${profil.abonne && !plein ? 'Participer (Confirmé direct)' :
                 (plein ? 'Rejoindre la file d’attente' :
                 (avantH24 && !profil.abonne ? 'Rejoindre la file d’attente (H-24)' : 'Participer'))}
             </button>`)
        : '';

      const invitesHtml = mesInvites.map(invite => `
        <button onclick="annulerInscription('${echapper(invite.id)}')"
          class="w-full bg-red-50 border border-red-200 text-red-800 font-bold text-xs p-2.5 rounded-lg text-left">
          Annuler le vote invité : ${echapper(invite.prenom)} ${echapper(invite.nom)}
          (${invite.statut === 'confirmed' ? 'confirmé' : 'en attente'})
        </button>`).join('');

      const numero = String(session.nom || '').match(/Session\s*(\d+)/i)?.[1] || '1';
      const carte = document.createElement('section');
      carte.className = annulee
        ? 'bg-slate-200 rounded-2xl p-4 shadow-sm border border-slate-400 opacity-75'
        : 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200';

      carte.innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <div>
            <h2 class="font-extrabold text-base ${annulee ? 'text-slate-600' : 'text-slate-900'}">
              ${echapper(session.nom)}
              <span class="text-xs text-slate-500 font-normal">
                (${new Date(session.debut_date).toLocaleDateString('fr-FR', {
                  weekday: 'long', day: 'numeric', month: 'short'
                })})
              </span>
            </h2>
            <p class="text-xs text-slate-500">🕒 ${echapper(session.horaires || '')}</p>
          </div>
          ${annulee
            ? '<span class="bg-slate-600 text-white font-bold text-[10px] px-2 py-1 rounded-full">ANNULÉE</span>'
            : `<span class="bg-emerald-100 text-emerald-800 font-extrabold text-xs px-2.5 py-1 rounded-full">${confirmes.length} / ${capacite}</span>`}
        </div>

        ${annulee ? `
          <p class="my-3 rounded-lg bg-slate-300/70 p-3 text-center text-xs font-bold text-slate-700">
            Session annulée — inscriptions conservées (${inscrits.length}).
          </p>` : ''}

        ${!annulee && !profil.abonne && avantH24 ? `
          <div class="bg-amber-50 text-amber-900 text-xs font-semibold p-2.5 rounded-xl my-3 border border-amber-200">
            ⏳ Règle H-24 : votre vote reste en attente jusqu’à la confirmation.
          </div>` : ''}

        ${!annulee ? `
          <div class="flex gap-2 mt-3">
            ${boutonVote}
            <button onclick="ouvrirInvite('${echapper(session.id)}')"
              class="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-3 rounded-xl border border-slate-300">
              + Invité
            </button>
          </div>
          ${mesInvites.length ? `<div class="space-y-2 mt-3">${invitesHtml}</div>` : ''}` : ''}

        <div class="border-t border-slate-300 mt-3 pt-3 flex flex-wrap justify-between items-center gap-2">
          <button onclick="ouvrirParticipants('${echapper(session.id)}')"
            class="text-xs font-bold text-blue-700">
            👥 Voir les inscrits (${confirmes.length} confirmés / ${attente.length} en attente)
          </button>

          ${profil.admin ? `
            <details class="relative">
              <summary class="cursor-pointer list-none text-[10px] font-semibold text-slate-600 bg-slate-100 border border-slate-300 px-2 py-1 rounded-md">
                ⚙ Gestion admin
              </summary>
              <div class="absolute right-0 bottom-8 z-20 w-36 rounded-lg border border-slate-300 bg-white p-2 shadow-lg space-y-1">
                <button onclick="ouvrirEdition('${echapper(session.id)}')"
                  class="w-full text-left text-[10px] font-semibold text-blue-800 hover:bg-blue-50 px-2 py-1.5 rounded">
                  Modifier jour / heures
                </button>
                ${annulee
                  ? `<button onclick="basculerAnnulation('${echapper(session.id)}', '${numero}')"
                       class="w-full text-left text-[10px] font-semibold text-emerald-800 hover:bg-emerald-50 px-2 py-1.5 rounded">
                       Relancer la session
                     </button>`
                  : `<button onclick="basculerAnnulation('${echapper(session.id)}', '${numero}')"
                       class="w-full text-left text-[10px] font-semibold text-red-800 hover:bg-red-50 px-2 py-1.5 rounded">
                       Annuler la session
                     </button>`}
              </div>
            </details>` : ''}
        </div>`;

      container.appendChild(carte);
    });
  }

  async function participer(sessionId) {
    const session = sessions.find(s => s.id === sessionId);
    if (!session) return alert('Session introuvable.');

    const confirmes = inscritsPour(sessionId).filter(i => i.statut === 'confirmed');
    const avantH24 = (new Date(session.debut_date).getTime() - Date.now()) > 24 * 3600000;

    let statut = 'confirmed';
    if (confirmes.length >= (Number(session.max_capacity) || 22)) statut = 'waitlisted';
    else if (!profil.abonne && avantH24) statut = 'waitlisted';

    const { error } = await supabaseClient.from('inscriptions').insert([{
      session_id: sessionId,
      prenom: profil.prenom,
      nom: profil.nom,
      est_invite: false,
      invite_par_nom: null,
      est_abonne: profil.abonne,
      statut,
      date_demande: Date.now(),
      reconfirme: false
    }]);

    if (error) return alert('Erreur lors du vote : ' + error.message);
    await rechargerInscriptions();
  }

  function ouvrirInvite(sessionId) {
    sessionInviteId = sessionId;
    document.getElementById('invite-prenom').value = '';
    document.getElementById('invite-nom').value = '';
    document.getElementById('modal-invite').classList.remove('hidden');
  }

  function fermerInvite() {
    document.getElementById('modal-invite').classList.add('hidden');
  }

  async function inscrireInvite() {
    const prenom = document.getElementById('invite-prenom').value.trim();
    const nom = document.getElementById('invite-nom').value.trim();
    if (!prenom || !nom) return alert('Prénom et nom de l’invité obligatoires.');

    const session = sessions.find(s => s.id === sessionInviteId);
    if (!session) return alert('Session introuvable.');

    const confirmes = inscritsPour(sessionInviteId).filter(i => i.statut === 'confirmed');
    const avantH24 = (new Date(session.debut_date).getTime() - Date.now()) > 24 * 3600000;
    const statut = confirmes.length >= (Number(session.max_capacity) || 22) || avantH24
      ? 'waitlisted' : 'confirmed';

    const { error } = await supabaseClient.from('inscriptions').insert([{
      session_id: sessionInviteId,
      prenom,
      nom,
      est_invite: true,
      invite_par_nom: `${profil.prenom} ${profil.nom}`,
      est_abonne: false,
      statut,
      date_demande: Date.now(),
      reconfirme: false
    }]);

    if (error) return alert('Erreur lors de l’inscription de l’invité : ' + error.message);
    fermerInvite();
    await rechargerInscriptions();
  }

  async function annulerInscription(id) {
    const vote = inscriptions.find(i => String(i.id) === String(id));
    if (!vote) return alert('Vote introuvable. Recharge la page puis réessaie.');
    if (!confirm(`Annuler le vote de ${vote.prenom} ${vote.nom} ?`)) return;

    const { error } = await supabaseClient.from('inscriptions').delete().eq('id', id);
    if (error) return alert('Erreur lors de l’annulation : ' + error.message);
    await rechargerInscriptions();
  }

  function ouvrirEdition(sessionId) {
    if (!profil.admin) return alert('Active le mode Administrateur dans Profil.');
    const session = sessions.find(s => s.id === sessionId);
    if (!session) return alert('Session introuvable.');

    sessionEditionId = sessionId;
    document.getElementById('edition-nom-session').textContent = session.nom;

    const date = new Date(session.debut_date);
    const deux = n => String(n).padStart(2, '0');

    document.getElementById('edition-date').value =
      `${date.getFullYear()}-${deux(date.getMonth() + 1)}-${deux(date.getDate())}`;

    const horaires = String(session.horaires || '').match(/(\d{1,2})h(\d{2})\s*-\s*(\d{1,2})h(\d{2})/i);
    document.getElementById('edition-debut').value = horaires
      ? `${deux(horaires[1])}:${horaires[2]}`
      : `${deux(date.getHours())}:${deux(date.getMinutes())}`;
    document.getElementById('edition-fin').value = horaires
      ? `${deux(horaires[3])}:${horaires[4]}`
      : '21:30';

    document.getElementById('modal-edition').classList.remove('hidden');
  }

  function fermerEdition() {
    document.getElementById('modal-edition').classList.add('hidden');
  }

  async function enregistrerModificationSession() {
    if (!profil.admin || !motDePasseAdminEnMemoire) {
      return alert('Le mode Administrateur a expiré. Rouvre Profil et reconnecte-toi.');
    }

    const dateTexte = document.getElementById('edition-date').value;
    const heureDebut = document.getElementById('edition-debut').value;
    const heureFin = document.getElementById('edition-fin').value;

    if (!dateTexte || !heureDebut || !heureFin) {
      return alert('Renseigne la date, l’heure de début et l’heure de fin.');
    }

    const debut = new Date(`${dateTexte}T${heureDebut}:00`);
    if (isNaN(debut.getTime())) return alert('La date ou l’heure saisie est invalide.');

    const session = sessions.find(s => s.id === sessionEditionId);
    const numero = String(session?.nom || '').match(/Session\s*(\d+)/i)?.[1] || '1';
    const jour = debut.toLocaleDateString('fr-FR', { weekday: 'long' });
    const nom = `${jour.charAt(0).toLocaleUpperCase('fr-FR')}${jour.slice(1)} — Session ${numero}`;
    const horaires = `${heureDebut.replace(':', 'h')} - ${heureFin.replace(':', 'h')}`;

    try {
      await appelerFonctionAdmin('update_session', {
        sessionId: sessionEditionId,
        debut_date: debut.toISOString(),
        horaires,
        nom
      });
      fermerEdition();
      await rechargerTout();
      alert('La date et les horaires de la session ont été modifiés.');
    } catch (error) {
      alert('Modification impossible : ' + (error.message || error));
    }
  }

  async function basculerAnnulation(sessionId) {
    if (!profil.admin || !motDePasseAdminEnMemoire) {
      return alert('Le mode Administrateur a expiré. Rouvre Profil et reconnecte-toi.');
    }

    const session = sessions.find(s => s.id === sessionId);
    if (!session) return alert('Session introuvable.');

    const annuler = session.statut !== 'annulee';
    const texteConfirmation = annuler ? 'ANNULER' : 'RELANCER';
    const instruction = annuler
      ? `Veuillez reconfirmer l’annulation de « ${session.nom} ».\n\nLes inscriptions seront conservées et la session sera grisée.\n\nSaisis ANNULER pour confirmer :`
      : `Veuillez reconfirmer la relance de « ${session.nom} ».\n\nLes inscriptions existantes seront conservées.\n\nSaisis RELANCER pour confirmer :`;

    const saisie = prompt(instruction);
    if (saisie === null) return;
    if (saisie.trim().toUpperCase() !== texteConfirmation) {
      alert(`Confirmation incorrecte. La session n’a pas été modifiée.`);
      return;
    }

    try {
      await appelerFonctionAdmin('set_session_status', {
        sessionId,
        statut: annuler ? 'annulee' : 'ouvert'
      });
      await rechargerTout();
      alert(annuler
        ? 'Session annulée. Les inscriptions sont conservées.'
        : 'Session relancée. Les inscriptions sont conservées.');
    } catch (error) {
      alert('Action impossible : ' + (error.message || error));
    }
  }

  function ouvrirParticipants(sessionId) {
    const session = sessions.find(s => s.id === sessionId);
    const inscrits = inscritsPour(sessionId);
    const confirmes = inscrits.filter(i => i.statut === 'confirmed');
    const attente = inscrits
      .filter(i => i.statut === 'waitlisted')
      .sort((a, b) => Number(a.date_demande || 0) - Number(b.date_demande || 0));

    document.getElementById('participants-titre').textContent = session?.nom || 'Participants';

    function ligne(i, index, confirme) {
      const estMonVote = !i.est_invite && memeNom(i.prenom, i.nom, profil.prenom, profil.nom);
      const estMonInvite = i.est_invite &&
        String(i.invite_par_nom || '').trim().toLowerCase() === `${profil.prenom} ${profil.nom}`.trim().toLowerCase();
      const peutAnnuler = profil.admin || estMonVote || estMonInvite;

      return `
        <div class="flex justify-between items-center gap-2 text-xs p-3 ${
          confirme ? 'bg-slate-50 border-slate-200' : 'bg-amber-50 border-amber-200'
        } rounded-xl border">
          <div>
            <b>${confirme ? index + 1 : '#' + (index + 1)}. ${echapper(i.prenom)} ${echapper(i.nom)}</b>
            ${i.est_invite ? `<span class="text-slate-500">(invité par ${echapper(i.invite_par_nom || '')})</span>` : ''}
            <p class="text-[10px] text-slate-500 mt-1">🕒 ${echapper(formatHorodatage(i.date_demande))}</p>
          </div>
          ${peutAnnuler ? `
            <button onclick="annulerInscription('${echapper(i.id)}')"
              class="shrink-0 text-red-700 font-bold bg-red-100 px-2 py-1 rounded-lg">Annuler</button>` : ''}
        </div>`;
    }

    document.getElementById('participants-corps').innerHTML = `
      <h3 class="font-extrabold text-xs uppercase text-slate-700">Confirmés (${confirmes.length})</h3>
      ${confirmes.length ? confirmes.map((i, n) => ligne(i, n, true)).join('') : '<p class="text-xs text-slate-400">Aucun joueur confirmé.</p>'}
      <h3 class="font-extrabold text-xs uppercase text-slate-700 mt-4">File d’attente (${attente.length})</h3>
      ${attente.length ? attente.map((i, n) => ligne(i, n, false)).join('') : '<p class="text-xs text-slate-400">File d’attente vide.</p>'}`;

    document.getElementById('modal-participants').classList.remove('hidden');
  }

  function fermerParticipants() {
    document.getElementById('modal-participants').classList.add('hidden');
  }

  demarrer();
</script>
</body>
