    let sessions = [];

    function formaterDateHeure(ts) {
      if (!ts) return '';
      const d = new Date(Number(ts));
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(':', 'h');
    }

    function memeNom(p1, n1, p2, n2) {
      return String(p1 || '').trim().toLowerCase() === String(p2 || '').trim().toLowerCase() &&
             String(n1 || '').trim().toLowerCase() === String(n2 || '').trim().toLowerCase();
    }

    function calculerDatesProchainsMatchs() {
      const now = new Date();
      const jour = now.getDay();
      let diffMardi = (2 - jour + 7) % 7;
      if (diffMardi === 0 && (now.getHours() > 21 || (now.getHours() === 21 && now.getMinutes() >= 30))) diffMardi = 7;
      
      let diffJeudi = (4 - jour + 7) % 7;
      if ((diffJeudi === 0 && (now.getHours() > 21 || (now.getHours() === 21 && now.getMinutes() >= 30))) || jour === 5 || jour === 6) {
        diffJeudi = (4 - jour + 7) % 7;
        if (diffJeudi <= 0) diffJeudi += 7;
      }

      const dateMardi = new Date(now);
      dateMardi.setDate(now.getDate() + diffMardi);
      dateMardi.setHours(19, 0, 0, 0);

      const dateJeudi = new Date(now);
      dateJeudi.setDate(now.getDate() + diffJeudi);
      dateJeudi.setHours(19, 30, 0, 0);

      return { dateMardi, dateJeudi };
    }

    function genererSessionsLocales() {
      const { dateMardi, dateJeudi } = calculerDatesProchainsMatchs();
      return [
        { id: 'session-mardi', nom: 'Mardi — Session 1', horaires: '19h00 - 21h30', debut_date: dateMardi.toISOString(), max_capacity: 22, statut: 'ouvert' },
        { id: 'session-jeudi', nom: 'Jeudi — Session 2', horaires: '19h30 - 21h30', debut_date: dateJeudi.toISOString(), max_capacity: 22, statut: 'ouvert' }
      ];
    }

    function demarrerApplication() {
      mettreAJourProfilUI();
      sessions = genererSessionsLocales();
      afficherSessions();

      try {
        if (window.supabase && window.supabase.createClient) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) {}

      if (supabaseClient) synchroniserEnLigne();
    }

    async function synchroniserEnLigne() {
      try {
        const { data: sess } = await supabaseClient.from('sessions').select('*').order('debut_date', { ascending: true });
        const { dateMardi, dateJeudi } = calculerDatesProchainsMatchs();
        const now = new Date();

        if (!sess || sess.length === 0) {
          const nouvelles = genererSessionsLocales();
          await supabaseClient.from('sessions').upsert(nouvelles);
          sessions = nouvelles;
        } else {
          for (const s of sess) {
            const dateSess = new Date(s.debut_date);
            if (dateSess.getTime() < now.getTime() - 2 * 3600 * 1000) {
              const nouvelleDate = s.id === 'session-mardi' ? dateMardi : dateJeudi;
              await supabaseClient.from('inscriptions').delete().eq('session_id', s.id);
              await supabaseClient.from('sessions').update({ debut_date: nouvelleDate.toISOString(), statut: 'ouvert' }).eq('id', s.id);
            }
          }
          sessions = sess;
        }

        await rechargerDonnees();

        supabaseClient.channel('realtime-basket')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'inscriptions' }, rechargerDonnees)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, rechargerDonnees)
          .subscribe();
      } catch (err) {}
    }

    async function rechargerDonnees() {
      if (!supabaseClient) return;
      try {
        const { data: sess } = await supabaseClient.from('sessions').select('*').order('debut_date', { ascending: true });
        const { data: insc } = await supabaseClient.from('inscriptions').select('*');
        if (sess && sess.length > 0) sessions = sess;
        if (insc) inscriptions = insc;
        await autoPromouvoirH24();
        afficherSessions();
      } catch (e) {}
    }

    async function autoPromouvoirH24() {
      const now = new Date();
      for (const session of sessions) {
        const dateDebut = new Date(session.debut_date);
        const delaiH = (dateDebut.getTime() - now.getTime()) / (3600 * 1000);
        
        if (delaiH <= 24 && delaiH > 0 && session.statut !== 'annulee') {
          const inscrits = (inscriptions || []).filter(i => i && i.session_id === session.id);
          const confirmes = inscrits.filter(i => i && i.statut === 'confirmed');
          const attente = inscrits.filter(i => i && i.statut === 'waitlisted').sort((a,b) => (a.date_demande || 0) - (b.date_demande || 0));

          let placesDisponibles = (session.max_capacity || 22) - confirmes.length;
          if (placesDisponibles > 0 && attente.length > 0) {
            const aConfirmer = attente.slice(0, placesDisponibles);
            for (const joueur of aConfirmer) {
              if (supabaseClient) {
                await supabaseClient.from('inscriptions').update({ statut: 'confirmed' }).eq('id', joueur.id);
              }
              joueur.statut = 'confirmed';
            }
          }
        }
      }
    }

    function afficherSessions() {
      const container = document.getElementById('sessions-container');
      if (!container) return;
      
      const sessionsAffichees = (sessions && sessions.length > 0) ? sessions : genererSessionsLocales();
      container.innerHTML = '';
      const now = new Date();

      sessionsAffichees.forEach(session => {
        try {
          const dateDebut = new Date(session.debut_date);
          const inscrits = (inscriptions || []).filter(i => i && i.session_id === session.id);
          const confirmes = inscrits.filter(i => i && i.statut === 'confirmed');
          const attente = inscrits.filter(i => i && i.statut === 'waitlisted').sort((a,b) => (a.date_demande || 0) - (b.date_demande || 0));

          const estPlein = confirmes.length >= (session.max_capacity || 22);
          const estAnnulee = session.statut === 'annulee';
          
          const monInsc = inscrits.find(i => i && !i.est_invite && memeNom(i.prenom, i.nom, monProfil.prenom, monProfil.nom));

          const delaiH = (dateDebut.getTime() - now.getTime()) / (3600 * 1000);
          const avantH24 = delaiH > 24;
          const estH2 = delaiH > 0 && delaiH <= 2;
          const dateTexte = dateDebut.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });

          const carte = document.createElement('div');
          carte.className = `bg-white rounded-2xl p-4 shadow-sm border ${estAnnulee ? 'border-red-300 bg-red-50/50' : 'border-slate-200'}`;
          
          let boutonTexte = 'Participer';
          let boutonClasse = 'bg-blue-600 hover:bg-blue-700 text-white';

          if (monProfil.estAbonneSaison) {
            boutonTexte = estPlein ? "Rejoindre la file d'attente" : 'Participer (Confirmé direct)';
            boutonClasse = estPlein ? 'bg-orange-600 hover:bg-orange-700 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white';
          } else {
            if (avantH24) {
              boutonTexte = "Rejoindre la file d'attente (H-24)";
              boutonClasse = 'bg-amber-600 hover:bg-amber-700 text-white';
            } else {
              boutonTexte = estPlein ? "Rejoindre la file d'attente" : 'Participer';
              boutonClasse = estPlein ? 'bg-orange-600 hover:bg-orange-700 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white';
            }
          }

          carte.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <div>
                <h2 class="font-extrabold text-base text-slate-900 ${estAnnulee ? 'text-red-700' : ''}">
                  ${session.nom} <span class="text-xs text-slate-500 font-normal">(${dateTexte})</span>
                </h2>
                <p class="text-xs text-slate-500">🕒 ${session.horaires}</p>
              </div>
              ${estAnnulee 
                ? `<span class="bg-red-600 text-white font-extrabold text-[11px] px-2.5 py-1 rounded-full">ANNULÉ</span>`
                : `<span class="font-extrabold text-xs px-2.5 py-1 rounded-full ${estPlein ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-800'}">
                     ${confirmes.length} / ${session.max_capacity || 22}
                   </span>`
              }
            </div>

            ${estAnnulee ? `
              <div class="bg-red-100 text-red-800 text-xs font-bold p-3 rounded-xl my-3 text-center border border-red-200">
                🚫 Cette session a été annulée par l'administrateur.
              </div>` : ''}

            ${!estAnnulee && !monProfil.estAbonneSaison && avantH24 ? `
              <div class="bg-amber-50 text-amber-900 text-xs font-semibold p-2.5 rounded-xl my-2 border border-amber-200">
                ⏳ <b>Règle H-24 :</b> Vous votez pour la file d'attente. Confirmation automatique dans ${Math.max(0, Math.round(delaiH - 24))}h si moins de 22 abonnés.
              </div>` : ''}

            ${!estAnnulee && monInsc && monInsc.statut === 'confirmed' && estH2 ? `
              <div class="bg-red-50 border border-red-200 p-3 rounded-xl my-3">
                <p class="text-xs font-extrabold text-red-800">🚨 Session dans moins de 2h !</p>
                <p class="text-[11px] text-red-600 mb-2">${monInsc.reconfirme ? '✅ Présence confirmée' : 'Reconfirmez votre présence ou cédez votre place.'}</p>
                <div class="flex gap-2">
                  ${!monInsc.reconfirme ? `<button onclick="reconfirmerH2('${monInsc.id}')" class="flex-1 bg-emerald-600 text-white font-bold text-xs py-2 rounded-lg">Je confirme ✅</button>` : ''}
                  <button onclick="annulerInscription('${session.id}', '${monInsc.id}')" class="flex-1 bg-red-600 text-white font-bold text-xs py-2 rounded-lg">J'annule ❌</button>
                </div>
              </div>` : ''}

            ${!estAnnulee ? `
              <div class="flex gap-2 mt-3">
                ${monInsc ? `
                  <button onclick="annulerInscription('${session.id}', '${monInsc.id}')" class="flex-1 bg-red-600 text-white font-extrabold text-xs py-3 rounded-xl shadow-sm">
                    Annuler ma place (${monInsc.statut === 'confirmed' ? 'Confirmé' : 'Attente'})
                  </button>` : `
                  <button onclick="participer('${session.id}')" class="flex-1 ${boutonClasse} font-extrabold text-xs py-3 rounded-xl shadow-sm">
                    ${boutonTexte}
                  </button>`}
                <button onclick="ouvrirModalInvite('${session.id}')" class="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-3 rounded-xl border border-slate-300">
                  + Invité
                </button>
              </div>` : ''}

            <div class="border-t border-slate-100 mt-3 pt-2 flex justify-between items-center">
              <button onclick="ouvrirModalListe('${session.id}')" class="text-xs font-bold text-blue-600">
                👥 Voir les inscrits (${confirmes.length} confirmés / ${attente.length} en attente)
              </button>
              ${monProfil.estAdmin ? `
                <button onclick="basculerSession('${session.id}', ${estAnnulee})" class="text-xs font-bold ${estAnnulee ? 'text-emerald-700 bg-emerald-50' : 'text-red-700 bg-red-50'} px-2 py-1 rounded-lg">
                  ${estAnnulee ? '🔄 Rétablir' : '🚫 Annuler la session (Admin)'}
                </button>` : ''}
            </div>
          `;
          container.appendChild(carte);
        } catch (errCard) {}
      });

    async function participer(sessionId) {
      if (!monProfil.prenom || !monProfil.nom) {
        alert('Veuillez renseigner votre Prénom et Nom dans Profil.');
        ouvrirModal('modal-profil');
        return;
      }

      const session = sessions.find(s => s.id === sessionId) || { max_capacity: 22, debut_date: new Date() };
      const dateDebut = new Date(session.debut_date);
      const now = new Date();
      const delaiH = (dateDebut.getTime() - now.getTime()) / (3600 * 1000);
      const avantH24 = delaiH > 24;

      const inscrits = (inscriptions || []).filter(i => i && i.session_id === sessionId);
      const confirmes = inscrits.filter(i => i && i.statut === 'confirmed');

      let statut = 'confirmed';
      if (confirmes.length >= (session.max_capacity || 22)) {
        statut = 'waitlisted';
      } else if (!monProfil.estAbonneSaison && avantH24) {
        statut = 'waitlisted';
      }

      const nouvelleInsc = {
        session_id: sessionId,
        prenom: monProfil.prenom.trim(),
        nom: monProfil.nom.trim(),
        est_invite: false,
        invite_par_nom: null,
        est_abonne: Boolean(monProfil.estAbonneSaison),
        statut: statut,
        date_demande: Date.now(),
        reconfirme: false
      };

      if (supabaseClient) {
        const { error } = await supabaseClient.from('inscriptions').insert([nouvelleInsc]);
        if (error) {
          alert("Erreur Supabase : " + error.message);
          return;
        }
      }

      await rechargerDonnees();

      if (statut === 'confirmed') {
        alert('Place confirmée ! 🏀');
      } else if (!monProfil.estAbonneSaison && avantH24) {
        alert('Pré-inscription enregistrée en file d’attente ! Validation automatique à H-24 si moins de 22 abonnés.');
      } else {
        alert('Session complète (22/22) : placé en file d’attente.');
      }
    }

    async function annulerInscription(sessionId, rsvpId) {
      const inscrits = (inscriptions || []).filter(i => i && i.session_id === sessionId);
      const joueur = inscrits.find(i => i.id === rsvpId);
      const nomJoueur = joueur ? `${joueur.prenom} ${joueur.nom}` : 'ce joueur';

      if (confirm(`Confirmez-vous l'annulation de la place de ${nomJoueur} ?`)) {
        if (supabaseClient) {
          const { error } = await supabaseClient.from('inscriptions').delete().eq('id', rsvpId);
          if (error) {
            alert("Erreur suppression : " + error.message);
            return;
          }

          if (joueur && joueur.statut === 'confirmed') {
            const premierAttente = inscrits
              .filter(i => i.statut === 'waitlisted' && i.id !== rsvpId)
              .sort((a,b) => (a.date_demande || 0) - (b.date_demande || 0))[0];

            if (premierAttente) {
              await supabaseClient.from('inscriptions').update({ statut: 'confirmed' }).eq('id', premierAttente.id);
              alert(`🎉 Place libérée ! ${premierAttente.prenom} ${premierAttente.nom} est automatiquement repêché(e).`);
            }
          }
        }

        await rechargerDonnees();
        fermerModal('modal-liste');
      }
    }

    async function reconfirmerH2(rsvpId) {
      if (supabaseClient) {
        await supabaseClient.from('inscriptions').update({ reconfirme: true }).eq('id', rsvpId);
      }
      await rechargerDonnees();
      alert('Présence validée ✅');
    }

    async function basculerSession(sessionId, estAnnulee) {
      const nouveau = estAnnulee ? 'ouvert' : 'annulee';
      if (confirm(estAnnulee ? 'Rétablir cette session ?' : 'Annuler cette session ? Les inscrits seront notifiés.')) {
        if (supabaseClient) {
          await supabaseClient.from('sessions').update({ statut: nouveau }).eq('id', sessionId);
        }
        await rechargerDonnees();
      }
    }

    async function validerInvite() {
      const prenom = document.getElementById('invite-prenom').value.trim();
      const nom = document.getElementById('invite-nom').value.trim();
      if (!prenom || !nom) return alert('Prénom et nom obligatoires.');

      const session = sessions.find(s => s.id === sessionActiveId) || { max_capacity: 22, debut_date: new Date() };
      const dateDebut = new Date(session.debut_date);
      const now = new Date();
      const delaiH = (dateDebut.getTime() - now.getTime()) / (3600 * 1000);
      const avantH24 = delaiH > 24;

      const inscrits = (inscriptions || []).filter(i => i && i.session_id === sessionActiveId);
      const confirmes = inscrits.filter(i => i && i.statut === 'confirmed');

      let statut = (confirmes.length >= (session.max_capacity || 22) || avantH24) ? 'waitlisted' : 'confirmed';

      const nomParrain = `${monProfil.prenom} ${monProfil.nom}`.trim();

      const nouvelInvite = {
        session_id: sessionActiveId,
        prenom,
        nom,
        est_invite: true,
        invite_par_nom: nomParrain,
        est_abonne: false,
        statut,
        date_demande: Date.now(),
        reconfirme: false
      };

      if (supabaseClient) {
        const { error } = await supabaseClient.from('inscriptions').insert([nouvelInvite]);
        if (error) {
          alert("Erreur lors de l'ajout de l'invité : " + error.message);
          return;
        }
      }

      fermerModal('modal-invite');
      document.getElementById('invite-prenom').value = '';
      document.getElementById('invite-nom').value = '';
      await rechargerDonnees();
      alert(`Invité inscrit (${statut === 'confirmed' ? 'Confirmé' : 'En attente'}) !`);
    }

    function toggleChampMotDePasse() {
      const estCoche = document.getElementById('check-admin').checked;
      const zoneMdp = document.getElementById('zone-mot-de-passe');
      if (zoneMdp) {
        if (estCoche) zoneMdp.classList.remove('hidden');
        else zoneMdp.classList.add('hidden');
      }
    }

    function sauvegarderProfil() {
      const prenom = document.getElementById('input-prenom').value.trim();
      const nom = document.getElementById('input-nom').value.trim();
      const estAbonne = document.getElementById('check-abonne').checked;
      const adminCoche = document.getElementById('check-admin').checked;
      const mdpSaisi = document.getElementById('input-mdp-admin').value.trim();

      if (!prenom || !nom) return alert('Prénom et nom requis.');

      let estAdminValide = false;
      if (adminCoche) {
        if (mdpSaisi === MOT_DE_PASSE_ADMIN || monProfil.estAdmin) {
          estAdminValide = true;
          alert('Mode Administrateur actif 🛡️');
        } else {
          alert('Mot de passe administrateur incorrect ❌');
          document.getElementById('check-admin').checked = false;
          toggleChampMotDePasse();
          return;
        }
      }

      monProfil.prenom = prenom;
      monProfil.nom = nom;
      monProfil.estAdmin = estAdminValide;
      monProfil.estAbonneSaison = estAbonne;

      localStorage.setItem('blr_prenom', prenom);
      localStorage.setItem('blr_nom', nom);
      localStorage.setItem('blr_admin', estAdminValide);
      localStorage.setItem('blr_abonne', estAbonne);

      mettreAJourProfilUI();
      fermerModal('modal-profil');
      afficherSessions();
    }

    function mettreAJourProfilUI() {
      document.getElementById('joueur-nom-header').innerText = `${monProfil.prenom} ${monProfil.nom}`;
      document.getElementById('input-prenom').value = monProfil.prenom;
      document.getElementById('input-nom').value = monProfil.nom;
      document.getElementById('check-abonne').checked = monProfil.estAbonneSaison;
      document.getElementById('check-admin').checked = monProfil.estAdmin;
      document.getElementById('btn-stats').style.display = monProfil.estAdmin ? 'block' : 'none';
      document.getElementById('badge-admin').style.display = monProfil.estAdmin ? 'inline' : 'none';
      document.getElementById('badge-statut').innerText = monProfil.estAbonneSaison ? '⭐ Abonné Saison' : '🎟️ Essai : 1/2 utilisé';
      toggleChampMotDePasse();
    }

    function ouvrirModalListe(sessionId) {
      sessionActiveId = sessionId;
      const session = sessions.find(s => s.id === sessionId) || { max_capacity: 22 };
      const inscrits = (inscriptions || []).filter(i => i && i.session_id === sessionId);
      const confirmes = inscrits.filter(i => i && i.statut === 'confirmed');
      const attente = inscrits.filter(i => i && i.statut === 'waitlisted').sort((a,b) => (a.date_demande || 0) - (b.date_demande || 0));

      const monNomComplet = `${monProfil.prenom} ${monProfil.nom}`.trim().toLowerCase();

      function genererLigne(j, index, estConfirm) {
        const estMonPropreVote = !j.est_invite && memeNom(j.prenom, j.nom, monProfil.prenom, monProfil.nom);
        const estMonInvite = j.est_invite && String(j.invite_par_nom || '').trim().toLowerCase() === monNomComplet;
        const peutAnnuler = monProfil.estAdmin || estMonPropreVote || estMonInvite;

        let texteBouton = 'Retirer';
        if (monProfil.estAdmin) texteBouton = 'Annuler (Admin)';
        else if (estMonPropreVote) texteBouton = 'Annuler ma place';
        else if (estMonInvite) texteBouton = 'Annuler cet invité';

        return `
          <div class="flex justify-between items-center text-xs p-2.5 ${estConfirm ? 'bg-slate-50 border-slate-100' : 'bg-amber-50 border-amber-200'} rounded-xl border">
            <div>
              <span class="font-bold text-slate-900">
                <b class="${estConfirm ? 'text-blue-600' : 'text-amber-700'} mr-1">${estConfirm ? (index + 1) + '.' : '#' + (index + 1)}</b> 
                ${j.prenom} ${j.nom} 
                ${j.est_invite ? `<span class="text-slate-500 font-normal">(invité par ${j.invite_par_nom || 'un membre'})</span>` : ''}
                ${j.reconfirme ? '✅' : ''}
              </span>
              <p class="text-[10px] text-slate-400 font-medium">🕒 Voté le ${formaterDateHeure(j.date_demande)}</p>
            </div>
            ${peutAnnuler ? `<button onclick="annulerInscription('${sessionId}', '${j.id}')" class="text-red-700 font-extrabold text-[11px] bg-red-100 border border-red-200 px-2 py-1 rounded-lg">${texteBouton}</button>` : ''}
          </div>`;
      }

      let html = `<h4 class="font-extrabold text-xs text-slate-700 tracking-wide uppercase">Confirmés (${confirmes.length}/${session.max_capacity || 22})</h4><div class="space-y-2 mt-2">`;
      if (confirmes.length === 0) html += `<p class="text-xs text-slate-400 italic">Aucun joueur confirmé pour le moment.</p>`;
      confirmes.forEach((j, index) => { html += genererLigne(j, index, true); });

      html += `</div><h4 class="font-extrabold text-xs text-slate-700 tracking-wide uppercase mt-4">File d'attente (${attente.length})</h4><div class="space-y-2 mt-2">`;
      if (attente.length === 0) html += `<p class="text-xs text-slate-400 italic">File d'attente vide.</p>`;
      attente.forEach((j, index) => { html += genererLigne(j, index, false); });
      html += `</div>`;

      document.getElementById('liste-corps').innerHTML = html;
      ouvrirModal('modal-liste');
    }

    function ouvrirModalStats() {
      let stats = {};
      (inscriptions || []).forEach(i => {
        if (i && i.prenom && i.nom) {
          const cle = `${i.prenom} ${i.nom}` + (i.est_invite ? ` (invité par ${i.invite_par_nom || 'un membre'})` : '');
          stats[cle] = (stats[cle] || 0) + 1;
        }
      });
      let html = Object.keys(stats).map(nom => `
        <div class="flex justify-between text-xs py-2 border-b">
          <span class="font-bold text-slate-800">${nom}</span>
          <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-bold">${stats[nom]} séance(s)</span>
        </div>
      `).join('') || '<p class="text-xs text-slate-400">Aucune donnée pour le moment.</p>';

      document.getElementById('stats-corps').innerHTML = html;
      ouvrirModal('modal-stats');
    }

    function exporterCSV() {
      let csv = "Prénom,Nom,Statut,Type,Parrain,Horodatage\n";
      (inscriptions || []).forEach(i => {
        if (i) {
          csv += `"${i.prenom || ''}","${i.nom || ''}","${i.statut || ''}","${i.est_invite ? 'Invité' : 'Membre'}","${i.invite_par_nom || ''}","${formaterDateHeure(i.date_demande)}"\n`;
        }
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "Asso_BLR_Inscriptions.csv";
      a.click();
    }

    function ouvrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function fermerModal(id) { document.getElementById(id).classList.add('hidden'); }
    function ouvrirModalInvite(id) { sessionActiveId = id; ouvrirModal('modal-invite'); }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrerApplication);
    } else {
      demarrerApplication();
    }
  </script>
</body>
</html>
